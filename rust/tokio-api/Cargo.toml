[package]
name = "tokio-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The point of this crate is to show what the Tokio stack costs with no web
# framework on top, so the dependency list is deliberately the floor: the
# protocol implementation, the IO adapter it needs to talk to Tokio, the body
# helpers that ship with it, and the same serde / chrono / multipart parsers the
# framework implementations use underneath their own abstractions.
#
# Everything a framework would have supplied — routing, query-string decoding,
# extractors, validation, error responses, SSE framing — is written out in
# `src/`.
[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time"] }
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.4"
bytes = "1.12"
# axum's `Multipart` extractor is a thin wrapper over this crate; using it
# directly keeps the upload scenario a comparison of frameworks rather than of
# multipart parsers.
multer = "3.1.0"
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
